# Quality gate: chạy eval agent v2 trên mỗi pull request.
# run_eval.py trả exit code 1 khi accuracy dưới ngưỡng hoặc có câu bị regression,
# nên job fail. Bật "Require status checks to pass" cho nhánh main để chặn merge.
name: quality-gate

on: [pull_request]

jobs:
  eval:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: 06-lab-complete/benchmark-observability/develop
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run agent and eval
        env:
          AGENT_VERSION: v2
          MOCK_ERROR_RATE: "0"   # lỗi ngẫu nhiên của mock không được làm gate chập chờn
        run: |
          python app.py > agent.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://localhost:8000/health && break; sleep 1; done
          python eval/run_eval.py --url http://localhost:8000 \
            --min-accuracy 0.85 --baseline reports/eval_v2_fixed.json
