# Chạy agent + Redis ở máy local:  docker compose up --build
services:
  agent:
    build: .
    ports:
      - "8000:8000"
    env_file:
      # Chứa AGENT_API_KEY. Không có file .env thì compose vẫn chạy được.
      - path: .env
        required: false
    environment:
      # Hai giá trị này ghi đè .env: bên trong mạng compose, Redis tên là "redis"
      REDIS_URL: redis://redis:6379/0
      PORT: "8000"   # khớp với ánh xạ cổng ở trên
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    # Không mở cổng ra máy host: chỉ agent trong mạng compose truy cập được
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped
