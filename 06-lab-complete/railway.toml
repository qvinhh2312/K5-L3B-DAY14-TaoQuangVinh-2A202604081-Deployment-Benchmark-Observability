# Cấu hình deploy Railway cho MỘT service (agent).
# Redis và biến môi trường (AGENT_API_KEY, REDIS_URL) đặt trên Railway, không ghi ở đây.

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
# Không đặt startCommand: dùng CMD của Dockerfile, nơi đã đọc biến PORT do Railway cấp
healthcheckPath = "/health"
healthcheckTimeout = 60
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
