# Render Blueprint: khai báo cả agent lẫn Redis (Key Value).
# File nằm trong thư mục con, nên khi tạo Blueprint phải chỉ đường dẫn 06-lab-complete/render.yaml.
services:
  - type: web
    name: day14-agent
    runtime: docker
    plan: free
    region: singapore
    rootDir: 06-lab-complete        # Dockerfile và build context tính từ thư mục này
    healthCheckPath: /health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: AGENT_API_KEY
        generateValue: true         # Render tự sinh, không nằm trong git
      - key: REDIS_URL
        fromService:                # lấy địa chỉ từ service Key Value bên dưới
          type: keyvalue
          name: day14-redis
          property: connectionString
      - key: RATE_LIMIT_PER_MINUTE
        value: "10"
      - key: DAILY_BUDGET_USD
        value: "1.0"

  - type: keyvalue
    name: day14-redis
    plan: free
    region: singapore
    ipAllowList: []                 # chỉ truy cập từ mạng nội bộ Render
